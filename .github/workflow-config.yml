# GitHub Actions Workflow Configuration
#
# This file controls enable/disable toggles for shared workflows.
# Workflows default to enabled if this file is missing.
#
# - enabled: workflow 자체 활성화 (false면 수동 트리거도 비활성)
# - auto: PR 생성 시 자동 실행 여부 (없으면 해당 없음, 수동 트리거는 enabled만 체크)

# Shared workflow version pin for jhw7500/automation.
automation_ref: v1.73
automation_commit: 3d60f3baaa45820f7260912efea3ffcf45c10b07

# PR 자동 리뷰 스위치(최상위). 공유 워크플로우가 이 키를 읽는다.
# **미지정 시 false 다** — 그래서 종전에는 `review:request` 라벨을 붙인 PR 만 리뷰를
# 받았고, 라벨이 없는 PR 은 워크플로가 `failed` 가 아니라 **`skipping`** 으로 찍혀
# 리뷰가 0건인 줄 모르고 지나갔다. 실제로 PR #100(15파일 +507/-150)이 그 상태였다.
# 같은 문제를 gstApp 에서 겪었다 — PR #115·#117 이 리뷰 0건이었고, 이 두 줄을 넣은
# 뒤 PR #123 부터 라벨 없이 자동 리뷰가 돌았다(같은 automation 커밋 3d60f3ba 핀).
review:
  auto: true

workflows:
  # Repo-specific
  shellcheck:
    enabled: true
    description: "Shell script static analysis"

  build-test:
    enabled: true
    description: "Build and test the package"

  # Shared Gemini workflows
  gemini-dispatch:
    enabled: true
    description: "Central dispatcher for Gemini commands"

  gemini-invoke:
    enabled: true
    description: "General Gemini CLI invocation"

  gemini-review:
    enabled: true
    description: "PR code review with Gemini (manual: @gemini-cli /review)"

  gemini-triage:
    enabled: true
    description: "Issue triage and labeling"

  gemini-auto-review:
    enabled: true
    description: "Automatic PR review with Gemini"

  gemini-scheduled-triage:
    enabled: false
    description: "Scheduled issue triage (disabled to avoid hourly runs)"

  # Shared Claude workflows
  claude:
    enabled: true
    description: "Claude AI integration (manual: @claude)"

  claude-code-review:
    enabled: true
    description: "Claude automatic PR review"

  # Shared OpenCode workflows
  # 자동실행 게이트는 이 블록의 `auto:` 가 아니라 최상위 `review.auto` 다
  # (공유 워크플로우가 그 키를 읽고, 미지정이면 true). 그래서 `auto:` 를 두지 않는다.
  # 모델은 zai-coding-plan/glm-4.7, 인증은 저장소 시크릿 ZHIPU_API_KEY.
  opencode-auto-review:
    enabled: true
    description: "OpenCode automatic PR review (zai-coding-plan/glm-4.7)"

# === Shared Settings ===
claude:
  model: "claude-sonnet-4-6"
