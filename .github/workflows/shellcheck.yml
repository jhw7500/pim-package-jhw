name: ShellCheck

# paths 필터를 두지 않는다. `'**.sh'` 는 확장자 없는 셸 스크립트의 변경에 발동하지
# 않으므로, 아래 shebang 기준 발견과 맞지 않는다 - cam-recoveryctl 이나 DEBIAN
# 유지보수 스크립트만 바뀐 PR 에서 검사가 아예 돌지 않는다.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if disabled'
        type: boolean
        default: false

jobs:
  shellcheck:
    name: ShellCheck Analysis
    if: ${{ github.event.inputs.force_run == 'true' || vars.SHELLCHECK_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          set -euo pipefail

          # 아직 넣지 못한 파일. 넣는 순간 CI 가 빨개진다.
          exclude=(
            # 보드 SD 마운트 경로. glob 을 -d 에 넘기는 SC2144(각 :9,:25)로 실제
            # 결함이지만 하드웨어 없이 고칠 수 없다.
            dist/pim/root/SOMBASE_TEST/automnt_sda.sh
            dist/pim/root/SOMBASE_TEST/automnt_sdb.sh
            # 벤더가 준 공장 도구(파일명에 버전). CR 이 섞여 SC1017/SC1072 가 뜨지만
            # 받은 그대로 두어야 한다.
            dist/pim/root/SOMBASE_TEST/mfg60n-aarch64-9.32.0.6.sh
          )

          # 확장자가 아니라 shebang 으로 찾는다. `.sh` 와 디렉터리 목록으로 고르던 앞선
          # 판은 두 가지를 놓쳤다. 첫째, 확장자가 없는 셸 스크립트 전부 - cam-recoveryctl
          # (복구 CLI), DEBIAN 유지보수 스크립트 5 개, rc.local, logrotate, ord/vcm 의
          # make-for-imx8 이 그래서 한 번도 검사되지 않았다. 둘째, 목록에 없던 디렉터리 -
          # dist/pim/opt/pim/lib(복구 로직 본체), dist/pim/opt/cis/bin, SOMBASE_TEST,
          # 저장소 루트의 sync-*.sh. 합쳐서 62 개가 밖에 있었다.
          # 손으로 나열하면 다음에 추가되는 스크립트가 또 빠진다 - 이 공백이 그렇게 생겼다.
          files=()
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sh) ;;
              *)
                # 첫 줄만, 그것도 앞 200 바이트까지만 본다. 명령치환이 아니라 파이프로
                # 넘기는 이유는 추적 파일에 바이너리(.ko 등)가 섞여 있어 치환이면 NUL
                # 경고를 쏟기 때문이다. 바이너리는 이 패턴에 걸리지 않는다.
                # sed 는 GNU env 의 split-string 옵션을 공백으로 되돌린다. `-Sbash` 나
                # `--split-string=bash` 는 인터프리터 앞이 공백도 `/` 도 아니어서 아래
                # 패턴에 안 걸리고, 그러면 셸 스크립트가 조용히 게이트 밖으로 빠진다 -
                # 이 PR 이 닫으려는 실패와 같은 모양이다(실측). 공백만 끼워 넣으므로
                # `-S` 뒤가 셸 이름이 아니면 포함 판정이 바뀌지 않는다.
                # 이름 뒤 `[0-9.]*` 는 `ksh93`·`bash5` 처럼 버전이 붙는 변형을 받는다.
                #
                # 여기서 멈추는 경계는 shellcheck 자신이 정한다 - 게이트가 검사기보다
                # 정밀할 수 없다. v0.9.0 에 같은 shebang 들을 직접 물어본 결과:
                #   -Sbash / --split-string=bash / ksh93  -> 셸로 인식 (위 판정과 일치)
                #   -S'bash' / -S\ bash                   -> SC1008 error, 못 읽는다
                #   env python3 / /usr/bin/python3        -> SC1071, 비셸로 정확히 식별
                #   -S -u bash python3                    -> 셸로 인식 (shellcheck 도 틀린다)
                # 그래서 인용·이스케이프된 split-string 은 **일부러** 받지 않는다. 받으면
                # shellcheck 가 SC1008 로 거부해, 분석할 수 없는 파일 때문에 게이트가
                # 빨개진다. `-S -u bash python3` 처럼 셸 이름이 다른 옵션의 피연산자인
                # 형태는 과포획으로 남는다 - 위임할 오라클이 없고(shellcheck 도 같은 맹점),
                # 결과가 조용한 통과가 아니라 시끄러운 실패라서 그대로 둔다. 이 저장소에는
                # 두 형태 모두 없다(실측).
                head -c 200 -- "$f" 2>/dev/null | head -n 1 \
                  | LC_ALL=C sed -E 's/(^|[[:space:]])(-S|--split-string=)/\1 /g' \
                  | LC_ALL=C grep -Eq \
                    '^#!.*[[:space:]/](sh|bash|dash|ksh|zsh)[0-9.]*([[:space:]]|$)' \
                  || continue
                ;;
            esac
            skip=0
            for e in "${exclude[@]}"; do
              [ "$f" = "$e" ] && skip=1 && break
            done
            [ "$skip" -eq 0 ] && files+=("$f")
          done < <(git ls-files -z)

          echo "Checking ${#files[@]} files (excluded ${#exclude[@]})..."
          shellcheck -x -s bash -S error -f gcc "${files[@]}"

      - name: Summary
        if: always()
        run: |
          echo "## ShellCheck Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ShellCheck analysis completed." >> $GITHUB_STEP_SUMMARY
