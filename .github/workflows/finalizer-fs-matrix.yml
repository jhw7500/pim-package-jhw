name: Finalizer Filesystem Matrix

on:
  pull_request:
    branches: [master]
    paths:
      - 'tools/finalizer_noreplace.c'
      - 'test/finalizer/run_filesystem_matrix.sh'
      - '.github/workflows/finalizer-fs-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-filesystems:
    name: Isolated ext4 FAT32 exFAT no-replace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR sources
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install filesystem creation tools (GitHub VM only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            e2fsprogs dosfstools exfatprogs
      - name: Mount new disposable filesystem images and verify no-replace
        run: bash test/finalizer/run_filesystem_matrix.sh
