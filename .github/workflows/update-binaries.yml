name: Update Binaries

# 상위 저장소 릴리스에서 바이너리를 받아 교체 PR 을 연다.
#
# 주의 — 이 워크플로우는 **아직 한 번도 동작한 적이 없다.** 두 가지가 어긋나 있었다.
#
#   1. 받은 파일을 `dist/modules/` · `dist/bin/` 에 놓고 있었는데, 두 디렉터리는 이
#      저장소 git 이력에 **존재한 적이 없다.** 실제 위치는 아래 case 문에 있다.
#   2. `jhw7500/max9296` · `gstApp` · `sc16is7xx` 어디에도 **릴리스가 없다.**
#
# 1번은 이 커밋에서 고쳤다. 2번은 상위 저장소가 릴리스를 올려야 풀린다 — 그전까지
# 실제 배포 경로는 로컬 빌드 + `update_bin.sh` + 수동 PR 이다(pim#38 이 그 예).
# 따라서 이 워크플로우는 여전히 **end-to-end 로 검증되지 않았다.** 처음 돌릴 때는
# 결과 PR 의 diff 를 반드시 눈으로 확인할 것.

on:
  repository_dispatch:
    types: [binary-update]
  workflow_dispatch:
    inputs:
      source:
        description: 'Source repo name (max9296, gstApp, sc16is7xx)'
        required: true
        type: choice
        options:
          - max9296
          - gstApp
          - sc16is7xx

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update Binary from Source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `.ko` 는 `*.ko filter=lfs` 로 LFS 대상이다. 새 파일을 커밋하려면 clean
          # 필터와 lfs push 가 동작해야 하므로 여기서 lfs 를 켠다.
          lfs: true

      - name: Determine target
        id: target
        run: |
          set -euo pipefail
          SOURCE="${{ github.event.client_payload.source || inputs.source }}"
          TAG="${{ github.event.client_payload.tag || 'latest' }}"

          # 실제 배포 위치와 git index 모드. 모드가 틀리면 .deb 에 실행 불가 파일이
          # 실린다 — 이 저장소는 그 사고를 이미 겪었다.
          case "$SOURCE" in
            max9296)
              ASSET=max9296.ko
              DEST=dist/pim/opt/pim/driver/max9296.ko
              MODE=644
              ;;
            sc16is7xx)
              ASSET=sc16is7xx_ext.ko
              DEST=dist/pim/opt/pim/driver/sc16is7xx_ext.ko
              MODE=755
              ;;
            gstApp)
              ASSET=gstApp
              DEST=dist/pim/usr/local/bin/gstApp
              MODE=755
              ;;
            *)
              echo "::error::Unknown source: $SOURCE"
              exit 1
              ;;
          esac

          {
            echo "name=$SOURCE"
            echo "tag=$TAG"
            echo "asset=$ASSET"
            echo "dest=$DEST"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

      - name: Download and place binary
        env:
          GH_TOKEN: ${{ secrets.PIM_PACKAGE_PAT || github.token }}
          SOURCE: ${{ steps.target.outputs.name }}
          TAG: ${{ steps.target.outputs.tag }}
          ASSET: ${{ steps.target.outputs.asset }}
          DEST: ${{ steps.target.outputs.dest }}
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)

          # 자산 이름을 정확히 지정한다. 예전 `*.ko` 는 릴리스에 모듈이 둘 이상이면
          # 엉뚱한 것까지 받아 온다.
          if [ "$TAG" = "latest" ]; then
            gh release download --repo "jhw7500/$SOURCE" -p "$ASSET" -D "$work" --clobber
          else
            gh release download "$TAG" --repo "jhw7500/$SOURCE" -p "$ASSET" -D "$work" --clobber
          fi

          if [ ! -f "$work/$ASSET" ]; then
            echo "::error::릴리스에 $ASSET 이 없다 (jhw7500/$SOURCE @ $TAG)"
            exit 1
          fi

          # 대상이 이미 추적되는 파일이므로 디렉터리는 존재한다. install 로 모드까지
          # 한 번에 맞춘다.
          install -m "$MODE" "$work/$ASSET" "$DEST"

          echo "배치: $DEST (mode $MODE)"
          echo "sha256: $(sha256sum "$DEST" | cut -d' ' -f1)"
          ls -la "$DEST"

      - name: Verify against manifest
        id: verify
        # 매니페스트는 자동으로 갱신하지 않는다. 이 검사가 내는 경고가 곧 "사람이
        # 확인하고 매니페스트를 갱신하라"는 신호다. 봇이 스스로 해시를 축복하면
        # 검사가 무의미해진다. 여기서도 차단하지 않는다.
        run: python3 tools/verify_binaries.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PIM_PACKAGE_PAT || github.token }}
          title: 'chore: ${{ steps.target.outputs.name }} 바이너리 업데이트 (${{ steps.target.outputs.tag }})'
          body: |
            소스: `jhw7500/${{ steps.target.outputs.name }}`
            태그: `${{ steps.target.outputs.tag }}`
            자산: `${{ steps.target.outputs.asset }}`
            대상: `${{ steps.target.outputs.dest }}` (mode ${{ steps.target.outputs.mode }})

            자동 생성된 PR입니다.

            ## 머지 전 할 일

            1. **`.github/binary-manifest.json` 을 이 PR 에서 갱신한다.**
               `Binary Verify` 워크플로우가 sha256 불일치를 경고로 알려준다(차단하지 않음).
               갱신할 값: `sha256`, `size`, `source.commit`.
            2. 바이너리가 실제로 동작하는지 확인한다. 이 PR 은 파일을 바꿀 뿐
               **보드에서 검증하지 않는다.**

            이 워크플로우는 end-to-end 로 검증된 적이 없다. 첫 실행이라면 diff 를
            눈으로 확인할 것.
          branch: 'auto/binary-update-${{ steps.target.outputs.name }}'
          commit-message: 'chore: ${{ steps.target.outputs.name }} 바이너리 업데이트 (${{ steps.target.outputs.tag }})'
          delete-branch: true
