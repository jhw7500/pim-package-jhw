name: Binary Verify

# 추적되는 바이너리(.ko, gstApp 등)는 diff 로 내용을 볼 수 없다. 리뷰어가 확인할 수
# 있는 건 PR 설명에 적힌 sha256·심볼 주장뿐이고, 그게 실제 파일과 맞는지 검사하는
# 곳이 없었다(리뷰에서 #31·#38 두 번 지적됐다). 이 워크플로우가 그 자리를 메운다.
#
# **차단하지 않는다.** 불일치는 경고 주석과 요약으로만 남기고 job 은 항상 성공한다.
# 검증되지 않은 중간 상태로 작업하는 경우가 흔해서, 여기서 막으면 도움이 아니라
# 방해가 된다. 막고 싶어지면 verify_binaries.py 에 --strict 를 붙이면 된다.

on:
  push:
    branches: [master]
    paths:
      - 'dist/pim/usr/local/bin/**'
      - 'dist/pim/opt/pim/driver/**'
      - '.github/binary-manifest.json'
      - 'tools/verify_binaries.py'
      - '.github/workflows/binary-verify.yml'
  pull_request:
    branches: [master]
    paths:
      - 'dist/pim/usr/local/bin/**'
      - 'dist/pim/opt/pim/driver/**'
      - '.github/binary-manifest.json'
      - 'tools/verify_binaries.py'
      - '.github/workflows/binary-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    name: Verify Tracked Binaries
    # camera-tests 와 같이 opt-out 이다. 변수를 설정하지 않아 조용히 건너뛰면
    # 이 워크플로우가 메우려는 공백이 그대로 재현된다.
    if: ${{ vars.BINARY_VERIFY_ENABLED != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          # LFS 를 받지 않는다. `.ko` 는 포인터로 남지만 포인터의 `oid sha256:` 가
          # 곧 내용 해시라 무결성 대조에는 충분하고, 대역폭을 쓰지 않는다.
          # 대신 아키텍처·심볼 검사는 실제 파일이 있는 것만 수행된다.
          lfs: false

      - name: Verify against manifest
        run: python3 tools/verify_binaries.py

      - name: Note
        if: always()
        run: |
          {
            echo ""
            echo "이 검사는 **차단하지 않는다**. 불일치가 있어도 job 은 성공한다."
            echo "바이너리를 의도적으로 바꿨다면 \`.github/binary-manifest.json\` 을"
            echo "같은 커밋에서 갱신하면 경고가 사라진다."
          } >> "$GITHUB_STEP_SUMMARY"
