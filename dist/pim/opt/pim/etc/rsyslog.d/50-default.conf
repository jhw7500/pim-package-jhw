#  Default rules for rsyslog.
#
#			For more information see rsyslog.conf(5) and /etc/rsyslog.conf

template(name="outfmt" type="list") {
    property(name="timegenerated" dateFormat="rfc3339" position.from="1" position.to="10")
    constant(value=" ")
    property(name="timegenerated" dateFormat="rfc3339" position.from="12" position.to="23")
    constant(value="|")
    property(name="syslogseverity-text" caseConversion="upper")
    constant(value="|")
    property(name="programname")
    constant(value="|")
    property(name="msg" droplastlf="on" )
    constant(value="\n")
    }

template(name="outfmt2" type="list") {
    property(name="timegenerated" dateFormat="rfc3339" position.from="1" position.to="10")
    constant(value=" ")
    property(name="timegenerated" dateFormat="rfc3339" position.from="12" position.to="23")
    constant(value="|")
    property(name="syslogseverity-text" caseConversion="upper")
    constant(value="|")
    property(name="msg" droplastlf="on" )
    constant(value="\n")
    }

template(name="outfmt3" type="list") {
    property(name="timegenerated" dateFormat="rfc3339" position.from="1" position.to="10")
    constant(value=" ")
    property(name="timegenerated" dateFormat="rfc3339" position.from="12" position.to="23")
    constant(value="|")
    property(name="programname")
    constant(value="|")
    property(name="syslogseverity-text" caseConversion="upper")
    constant(value="|")
    property(name="msg" droplastlf="on" )
    constant(value="\n")
    }

#$template SysLocal,"/var/log/%fromhost%-%$YEAR%-%$MONTH%-%$DAY%.log"
#$template SysLocal,"/var/log/cantops/%$YEAR%%$MONTH%%$DAY%.log"
$template myformat,"%TIMESTAMP:1:10:date-rfc3339% %TIMESTAMP:19:12:date-rfc3339% %syslogtag%%msg%\n"
$template myformat2, "%timegenerated:1:10:date-rfc3339% %timegenerated:12:23:date-rfc3339% %programname%[%syslogpriority-text%]%msg%\n"
$ActionFileDefaultTemplate myformat2
#
# First some standard log files.  Log by facility.
#
auth,authpriv.*		/var/log/auth.log
*.*;auth,authpriv,local0,kern.none;		/var/log/cantops/syslog
#cron.*				/var/log/cron.log
#daemon.*			-/var/log/daemon.log
#kern.*				-/var/log/kern.log
#lpr.*				-/var/log/lpr.log
mail.*				-/var/log/mail.log
#user.*				-/var/log/user.log
#local0.notice			?SysLocal
local0.notice;*.emerg		/var/log/cantops/local0.log
kern.notice			/var/log/cantops/kern.log
#local0.alert        /dev/console

#*.err;local0.none,local1.none     -/var/log/cantops/local1.log;outfmt
local1.*                /var/log/cantops/local1.log;outfmt2
local2.*                /var/log/cantops/pim_gate.log;outfmt3 
#
# Logging for the mail system.  Split it up so that
# it is easy to write scripts to parse these files.
#
#mail.info			-/var/log/mail.info
#mail.warn			-/var/log/mail.warn
mail.err			/var/log/mail.err

#
# Some "catch-all" log files.
#
#*.=debug;\
#	auth,authpriv.none;\
#	news.none;mail.none	-/var/log/debug
#*.=info;*.=notice;*.=warn;\
#	auth,authpriv.none;\
#	cron,daemon.none;\
#	mail,news.none		-/var/log/messages

#
# Emergencies are sent to everybody logged in.
#
*.emerg				:omusrmsg:*
#local0.crit         :omusrmsg:*

