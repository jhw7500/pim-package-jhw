# Defaults can be restored by simply deleting this file.
#
# See journald.conf(5) for details.

[Journal]
Storage=volatile
#Compress=yes
#Seal=yes
#SplitMode=uid
SyncIntervalSec=1m
#RateLimitIntervalSec=30s
#RateLimitBurst=10000
SystemMaxUse=5000M
SystemKeepFree=5000M
#SystemMaxFileSize=
#SystemMaxFiles=100
RuntimeMaxUse=64M
RuntimeKeepFree=8M
#RuntimeMaxFileSize=
#RuntimeMaxFiles=100
#MaxRetentionSec=
MaxFileSec=24h
#ForwardToSyslog=yes
#ForwardToKMsg=no
#ForwardToConsole=no
ForwardToWall=no
#TTYPath=/dev/console
MaxLevelStore=info
MaxLevelSyslog=info
MaxLevelKMsg=info
MaxLevelConsole=info
MaxLevelWall=info
#LineMax=48K
#ReadKMsg=yes
